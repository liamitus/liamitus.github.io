  <head>
    <meta charset="utf-8" />

    <link rel="icon" type="image/png" href="/images/favicon-32x32.png" sizes="32x32" />

      location.replace('/?arcade');
    </script>
    <meta http-equiv="refresh" content="0; url=/?arcade" />
  </head>
